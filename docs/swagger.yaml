basePath: /api/v1
definitions:
  models.Ingredients:
    properties:
      amount:
        description: Amount needed in a recipe of an ingredient
        type: number
      name:
        description: Name of the ingredient
        type: string
      unit:
        description: Unit of the Amount
        type: string
    type: object
  models.Recipe:
    properties:
      components:
        items:
          $ref: '#/definitions/models.Ingredients'
        type: array
      description:
        type: string
      id:
        type: string
      name:
        type: string
      pictureLink:
        items:
          type: string
        type: array
      servings:
        type: integer
    type: object
  models.RecipeList:
    properties:
      recipes:
        items:
          type: string
        type: array
    type: object
  models.RecipePicture:
    properties:
      id:
        type: string
      name:
        type: string
      picture:
        type: string
    type: object
  sources.SourceOAuthConnectResponse:
    properties:
      id:
        type: string
      oAuthURL:
        type: string
    type: object
  sources.SourceResponse:
    properties:
      connected:
        type: boolean
      id:
        type: string
      name:
        type: string
      version:
        type: string
    type: object
  version.Version:
    properties:
      api:
        description: API is the MAJOR API Version supported by the app
        type: string
      app:
        description: APP is the version of the current app
        type: string
    type: object
info:
  contact: {}
  description: This is the API documentation for recipes-manager.
  license:
    name: MIT
    url: https://github.com/ottenwbe/recipes-manager/blob/master/LICENSE
  title: Swagger API documentation for recipes-manager
  version: "1.0"
paths:
  /auth/keycloak/login:
    get:
      description: Login by creating a token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
      summary: Login by creating a token
      tags:
      - Auth
  /auth/keycloak/logout:
    get:
      description: Logout by deleting the token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
      summary: Logout by deleting the token
      tags:
      - Auth
  /auth/keycloak/token:
    get:
      description: Get the token for a user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
      summary: Get the token
      tags:
      - Auth
  /health:
    get:
      description: Returns the health status of the service
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check endpoint
  /oauth:
    get:
      description: OAuth endpoint
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
      summary: OAuth endpoint
      tags:
      - Auth
  /recipes:
    get:
      description: A list of ids of recipes is returned
      parameters:
      - description: Search for a specific name
        in: query
        name: name
        type: string
      - description: Search for a specific term in a description
        in: query
        name: description
        type: string
      - description: Search for a specific ingredient
        in: query
        name: ingredient
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RecipeList'
      summary: Get Recipes
      tags:
      - Recipes
    post:
      consumes:
      - application/json
      description: Adds a new recipe, the id will automatically be overridden by the
        backend
      parameters:
      - description: models.Recipe
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/models.Recipe'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      summary: Add a new models.Recipe
      tags:
      - Recipes
  /recipes-count:
    get:
      description: The number of recipes is returned that is managed by the service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: integer
      summary: Get the number of recipes
      tags:
      - Recipes
  /recipes-random:
    get:
      description: A random recipe is returned
      parameters:
      - description: Number of Servings
        in: query
        name: servings
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Recipe'
      summary: Get a Random models.Recipe
      tags:
      - Recipes
  /recipes/r/{recipe}:
    delete:
      consumes:
      - application/json
      description: Deletes a recipe by id
      parameters:
      - description: models.Recipe ID
        in: path
        name: recipe
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "204":
          description: No Content
      summary: Delete a models.Recipe
      tags:
      - Recipes
    get:
      description: A specific recipe is returned
      parameters:
      - description: Number of Servings
        in: query
        name: servings
        type: integer
      - description: models.Recipe ID
        in: path
        name: recipe
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Recipe'
      summary: Get a specific models.Recipe
      tags:
      - Recipes
    put:
      consumes:
      - application/json
      description: A specific recipe is updated
      parameters:
      - description: models.Recipe ID
        in: path
        name: recipe
        required: true
        type: string
      - description: models.Recipe
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/models.Recipe'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "204":
          description: No Content
      summary: Update a specific models.Recipe
      tags:
      - Recipes
  /recipes/r/{recipe}/pictures/{name}:
    get:
      description: A specific picture of a specific recipe is returned
      parameters:
      - description: models.Recipe ID
        in: path
        name: recipe
        required: true
        type: string
      - description: Name of Picture
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RecipePicture'
      summary: Get a picture of a recipe
      tags:
      - Recipes
  /sources:
    get:
      description: List sources
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/sources.SourceResponse'
            type: object
      summary: List sources
      tags:
      - Sources
  /sources/{source}/connect:
    get:
      description: Trigger the oauth process
      parameters:
      - description: Source ID
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/sources.SourceOAuthConnectResponse'
      summary: Trigger the oauth process
      tags:
      - Sources
  /sources/{source}/oauth:
    get:
      description: Handles Tokens. Typically not directly called.
      parameters:
      - description: Source ID
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
          schema:
            type: string
      summary: Handles Tokens
      tags:
      - Sources
  /sources/{source}/recipes:
    patch:
      description: Download recipes from a source
      parameters:
      - description: Source ID
        in: path
        name: source
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      summary: Download Recipes from a Source
      tags:
      - Sources
  /version:
    get:
      description: Get the current version
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/version.Version'
      summary: Get the current version
swagger: "2.0"
